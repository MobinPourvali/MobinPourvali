name: Update profile art

"on":
  schedule:
    - cron: "17 6 * * *"   # ~06:17 UTC daily
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: profile-art
  cancel-in-progress: false

jobs:
  heatmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # Only the two runtime deps. The portrait libs in requirements.txt
      # (rembg / opencv / onnxruntime) are local-only and would add minutes
      # to every scheduled run for code this job never imports.
      - name: Install dependencies
        run: pip install "requests==2.32.3" "beautifulsoup4==4.12.3"

      - name: Fetch contributions
        run: python scripts/fetch_contributions.py

      - name: Render heatmap
        run: python scripts/render_heatmap_svg.py

      # Stdlib-only, so it adds no install cost. Refreshes the card's
      # "Last updated" stamp; the rest of the card is static.
      - name: Render info card
        run: python scripts/make_info_card.py

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh profile art [skip ci]"
          file_pattern: "data/contributions.json contrib-heatmap.svg info-card.svg"
