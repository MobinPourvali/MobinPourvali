name: Generate Hacker Snake
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

# Added: ghaction-github-pages force-pushes the `output` branch with
# GITHUB_TOKEN, which is read-only by default on repos created after Feb 2023.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#39FF14
      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
